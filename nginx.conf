server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/rss+xml image/svg+xml application/json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Pages are built as /slug/index.html but linked without a trailing slash.
  location / {
    try_files $uri $uri/index.html =404;
  }

  location ~ ^/(.+)/$ {
    return 301 /$1;
  }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  error_page 404 /404.html;
}
